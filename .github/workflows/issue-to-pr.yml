name: Issue → direkte til dataset

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  issue_to_data:
    if: ${{ github.event.label.name == 'create-data-pr' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install pyyaml

      - name: Add shop to dataset
        env:
          ISSUE_BODY: "${{ github.event.issue.body }}"
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
        run: python tools/auto_add_shop.py

      - name: Commit and push
        run: |
          git config user.email "matsjekk-bot@noreply.github.com"
          git config user.name "Matsjekk Bot"
          git add docs/data/
          git diff --cached --quiet || git commit -m "data: add manually reviewed shop from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ **Lagt til i databasen etter manuell gjennomgang.** Takk for bidraget!"
          gh issue close ${{ github.event.issue.number }}
