name: Auto-label submissions and reports

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply 'submission' label to suggestions
        if: startsWith(github.event.issue.title, '[Suggestion]')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['submission']
            });

      - name: Apply 'report' label to reports
        if: startsWith(github.event.issue.title, '[Report]')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['report']
            });

      - name: Apply 'submission' and 'news' labels to news submissions
        if: startsWith(github.event.issue.title, '[News Submission]')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['submission', 'news']
            });

      - name: Apply 'report' and 'news' labels to news reports
        if: startsWith(github.event.issue.title, '[News Report]')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['report', 'news']
            });
