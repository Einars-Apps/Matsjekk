name: Farmshops Area Cache Ingest (Supabase)

on:
  workflow_dispatch:

jobs:
  ingest-area-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build latest area cache
        run: |
          python tools/fetch_farmshops.py
          python tools/build_farmshops_area_cache.py

      - name: Ingest area cache to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/ingest_area_cache_to_supabase.py
