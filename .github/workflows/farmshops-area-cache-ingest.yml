name: Farmshops Area Cache Ingest (Supabase)

on:
  workflow_dispatch:

jobs:
  ingest-area-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FARMSHOP_FETCH_DEADLINE_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch latest farm shops
        timeout-minutes: 25
        run: python tools/fetch_farmshops.py

      - name: Build latest area cache
        timeout-minutes: 10
        run: python tools/build_farmshops_area_cache.py

      - name: Ingest area cache to Supabase
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/ingest_area_cache_to_supabase.py
