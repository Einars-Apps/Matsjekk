name: Auto-moderation av nyhetsartikler

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  auto_moderate_news:
    if: startsWith(github.event.issue.title, '[News Submission]')
    runs-on: ubuntu-latest
    concurrency:
      group: auto-moderate-news-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Run news auto-moderation
        id: moderate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          MAINTAINER_LOGIN: Einars-Apps
        run: python tools/auto_moderate_news.py
