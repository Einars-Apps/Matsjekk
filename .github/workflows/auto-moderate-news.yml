name: Auto-moderation av nyhetsartikler

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  auto_moderate_news:
    # Run only for news submissions.
    # Guard: skip if issue already has a decision label (prevents duplicate runs
    # when Worker creates issues with labels pre-set, triggering both 'opened' and 'labeled').
    if: |
      (
        (github.event.action == 'opened' && startsWith(github.event.issue.title, '[News Submission]')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'news' && contains(github.event.issue.labels.*.name, 'submission'))
      ) &&
      !contains(github.event.issue.labels.*.name, 'auto-approved') &&
      !contains(github.event.issue.labels.*.name, 'needs-manual-review') &&
      !contains(github.event.issue.labels.*.name, 'spam')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Run news auto-moderation
        id: moderate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          MAINTAINER_LOGIN: Einars-Apps
        run: python tools/auto_moderate_news.py
