name: Auto-moderation av innsendte forslag

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  auto_moderate:
    # Run when a new submission issue opens, OR when 'submission' label is added
    if: |
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'submission')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'submission')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install pyyaml requests

      - name: Run auto-moderation
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python tools/auto_moderate_submission.py
