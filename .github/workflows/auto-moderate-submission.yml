name: Auto-moderation av innsendte forslag

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  auto_moderate:
    # Run when a new submission issue opens, OR when 'submission' label is added
    if: |
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'submission')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'submission')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install pyyaml requests

      - name: Run auto-moderation
        id: moderate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          MAINTAINER_LOGIN: Einars-Apps
        run: python tools/auto_moderate_submission.py

      - name: Auto-add approved shop to dataset
        if: steps.moderate.outputs.approved == 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python tools/auto_add_shop.py

      - name: Commit and push dataset update
        if: steps.moderate.outputs.approved == 'true'
        run: |
          git config user.email "matsjekk-bot@noreply.github.com"
          git config user.name "Matsjekk Bot"
          git add docs/data/
          git diff --cached --quiet || git commit -m "data: auto-add shop from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue with success comment
        if: steps.moderate.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ **Lagt til i databasen!** Stedet er nå synlig på kartet. Takk for bidraget!"
          gh issue close ${{ github.event.issue.number }}
