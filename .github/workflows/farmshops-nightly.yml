name: Farmshops nightly

# Replaces the two nightly jobs that both fetched the same Overpass data:
# fetch_farmshops.yml at 02:00 UTC and farmshops-ingest.yml at 04:43 UTC.
# 03:15 UTC stays in that overnight window and finishes before EU Decisions
# Ingest (05:23 UTC), so the two writers are not querying Overpass together.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: farmshops-nightly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Script gives up and keeps stored country data before the step timeout.
  FARMSHOP_FETCH_DEADLINE_SECONDS: "1200"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Fetch latest farm shops
        timeout-minutes: 25
        run: python tools/fetch_farmshops.py

      - name: Build shared area cache
        timeout-minutes: 10
        run: python tools/build_farmshops_area_cache.py

      - name: Commit and push farmshops data
        id: commit
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/farmshops.json docs/data/farmshops_area_cache.json docs/data/farmshops_country_archive.json docs/data/farmshops_by_country
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No farmshops changes to publish."
            exit 0
          fi
          git commit -m "chore(farmshops): update farmshops data"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN pushes do not trigger workflow `push` events, so deploy
  # has to be called from this workflow. It runs only after a real commit,
  # and deploy_docs.yml queues on `docs-pages` so it cannot race another Pages deploy.
  deploy:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      pages: write
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/deploy_docs.yml
