name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["EU Decisions Ingest"]
    types: [completed]
    branches: [main]

concurrency:
  group: docs-pages
  cancel-in-progress: false

# Run bundled JavaScript actions (e.g. actions/deploy-pages@v4) on Node.js 24.
# Node.js 20 is being removed from GitHub-hosted runners (Sept 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - name: Upload docs folder as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy-pages:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
