name: EU Decisions Ingest

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  ingest-eu-decisions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Fetch automatic EU decisions
        run: python tools/fetch_eu_decisions.py

      - name: Commit updated EU decisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/eu_decisions_auto.json
          git diff --cached --quiet || git commit -m "chore(eu): update EU decisions feed"

      - name: Push changes
        run: git push
